# Relay settings — no secrets in this file.
#
# Device tokens live in the repo-root .env:
#     MORSE_TOKEN_DAD, MORSE_TOKEN_EMMA
# Copy .env.example to .env and run ./scripts/init-env.sh on first setup.
# config.py refuses to start if a token is present here or missing from .env.

[server]
host = "0.0.0.0"          # bind to the LAN; do not port-forward this port
port = 8080
db = "data/morse.db"      # relative to this file
family_name = "MORSE"
retention = 1000          # keep the newest N messages

# Optional Phase 4 phone/watch bridge; disabled for the LAN MVP.
[ntfy]
enabled = false
publish_topic = ""
subscribe_topic = ""
# The ntfy access token, if any, is read from the NTFY_TOKEN environment
# variable instead of this file.

[[devices]]
id = "dad"
name = "DAD"
peer = true               # counts toward the peer-online indicator

[[devices]]
id = "emma"
name = "EMMA"
peer = true

# Phase 4: enable the web chat by adding this block and MORSE_TOKEN_WEB in .env.
# [[devices]]
# id = "web"
# name = "WEB"
# peer = false
